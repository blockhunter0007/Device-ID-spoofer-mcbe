name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile --name "Device ID spoofer-onefile" "device_id_spoofer.py"

      - name: Build Standalone EXE
        run: |
          pyinstaller --noconsole --onedir --name "Device ID spoofer-standalone" "device_id_spoofer.py"
      
      - name: Zip Standalone Build
        run: |
          Compress-Archive `
            -Path "dist/Device ID spoofer-standalone/*" `
            -DestinationPath "dist/Device ID spoofer-standalone.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Device ID Spoofer ${{ github.ref_name }}"
          body_path: "release-notes/${{ github.ref_name }}.md"
          files: |
            dist/Device ID spoofer-onefile.exe
            dist/Device ID spoofer-standalone.zip